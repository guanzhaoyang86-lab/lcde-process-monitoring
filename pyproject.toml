[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mate-spc"
version = "0.2.0"
description = "UD-MAPIC: uncertainty-decoupled monitoring with structured missing data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
rdata = ["pyreadr>=0.5"]

[project.scripts]
mate-spc = "mate_spc.cli:main"
mapic-spc = "mate_spc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
